<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invitation</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      background: #fefaef;
      color: #4a4038;
      font-family: Georgia, serif;
    }

    .page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Flowers fill the width; on tall/wide screens they crop instead of growing */
    .flowers {
      display: block;
      width: 100%;
      height: auto;
      max-height: 28vh;
      object-fit: cover;
    }

    .top {
      object-position: top;
    }

    .bottom {
      object-position: bottom;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px 24px;
      background-color: #fefaef;
    }

    h1 {
      font-size: clamp(34px, 7vw, 60px);
      margin: 0 0 8px;
      font-weight: normal;
    }

    .small {
      letter-spacing: 3px;
      text-transform: uppercase;
      font-size: 14px;
      margin: 0 0 10px;
    }

    .name {
      font-size: clamp(24px, 4vw, 34px);
      font-style: italic;
      margin: 6px 0 18px;
    }

    p {
      margin: 4px 0;
      font-size: 18px;
    }
  </style>
</head>
